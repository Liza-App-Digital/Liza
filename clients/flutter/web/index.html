<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Без этого тега Safari считает страницу десктопной (980px) и при
       фокусе в поле зумит его, проматывая страницу вверх.
       user-scalable=no намеренно НЕ ставим: ломает доступность и на
       iOS 10+ всё равно игнорируется. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The cutest messenger in the Matrix network.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Liza">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Liza</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="splash/style.css">
  <!-- Мост flutter_inappwebview для Web: без него iframe мини-аппа грузится,
       но клиент не получает onLoadStart/onLoadStop и через 30 с показывает
       «Превышено время загрузки» (у всех мини-аппов в web-клиенте). -->
  <script type="application/javascript" src="assets/packages/flutter_inappwebview_web/assets/web/web_support.js" defer></script>


</head>

<body>
  <!-- pdf.js удалён 2026-08-27: наследие апстрима FluffyChat. Скрипт грузился
       с cdn.jsdelivr.net на КАЖДОМ старте (322 КБ распакованных, сторонний
       домен на критическом пути), но `pdfjsLib`/`pdfRenderOptions` в проекте
       не использовались нигде — PDF в клиенте не рендерится, единственное
       упоминание в коде — иконка типа файла (message_download_content.dart).
       Если PDF-просмотр появится — подключать локальной копией, не с CDN. -->
  <script src="flutter_bootstrap.js" async></script>
  <picture id="splash">
    <source
      srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light) or (prefers-color-scheme: no-preference)">
    <source
      srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">
    <img class="center" src="splash/img/light-1x.png" />
  </picture>
</body>

</html>
